[build]
  command = "mkdir -p dist && for f in index.html sw.js manifest.webmanifest icon-192.png icon-512.png; do curl -sSL \"https://wuswoaicjtuodzmrjwgf.supabase.co/storage/v1/object/public/site/$f\" -o \"dist/$f\"; done"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/javascript; charset=UTF-8"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json; charset=UTF-8"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
